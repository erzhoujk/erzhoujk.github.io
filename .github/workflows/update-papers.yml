name: Update multimodal paper radar

on:
  schedule:
    - cron: "0 1 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch recent papers
        run: python3 scripts/update_papers.py
      - name: Commit updated digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/papers.json
          git diff --cached --quiet || git commit -m "chore: update multimodal paper radar"
          git push
